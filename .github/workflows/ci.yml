name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv pip check
      - run: uv run pytest
      - run: uv run lidar-shield --version
      - run: uv run lidar-shield config validate --config configs/default.yaml

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv pip check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
